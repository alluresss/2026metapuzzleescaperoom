<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Room 4 - Living Room</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="escape-room.js"></script>
  </head>
  <body data-room="4">
    <main class="game-layout">
      <section class="room-stage" aria-labelledby="room-title">
        <div class="room-header">
          <div>
            <p class="eyebrow">Room 4</p>
            <h1 id="room-title">Living Room</h1>
          </div>
          <nav class="room-nav" aria-label="Room progression">
            <a class="room-link locked" href="room1.html" aria-disabled="true">1</a>
            <a class="room-link locked" href="room2.html" aria-disabled="true">2</a>
            <a class="room-link locked" href="room3.html" aria-disabled="true">3</a>
            <a class="room-link active" href="room4.html">4</a>
            <a class="room-link locked" href="room5.html" aria-disabled="true">5</a>
            <a class="room-link locked" href="room6.html" aria-disabled="true">6</a>
          </nav>
        </div>

        <div class="room-canvas room-4-canvas" aria-label="Clickable living-room objects">
          <button class="room-object living-tv" data-object="livingTv">TV</button>
          <button class="room-object living-couch" data-object="livingCouch">Couch</button>
          <button class="room-object living-drawers" data-object="livingDrawers">Drawers</button>
          <button class="room-object old-books" data-object="oldBooks">Old books</button>
          <button class="room-object floor-key" data-object="floorKey">Key 4</button>
          <button class="room-object living-door" data-object="livingDoor">Door</button>
        </div>
      </section>

      <aside class="side-panel" aria-label="Object popup and inventory">
        <section class="popup-card hidden" id="object-panel">
          <p class="eyebrow">Selected object</p>
          <h2 id="object-name">Nothing selected</h2>
          <p id="object-description">Click a rectangle in the room to open its popup description here.</p>
          <div class="action-row" id="object-actions" aria-label="Available actions"></div>
          <div class="status-message" id="status-message" role="status" aria-live="polite"></div>
        </section>

        <section class="inventory-card">
          <div class="panel-heading">
            <p class="eyebrow">Inventory</p>
            <button class="ghost-button" id="reset-progress" type="button">Reset</button>
          </div>
          <div class="inventory-list" id="inventory-list"></div>
          <p class="hint">Tip: with an object description open, click an inventory item to try using it there. Click empty room space first to open inventory items instead.</p>
        </section>
      </aside>
    </main>
  </body>
</html>
